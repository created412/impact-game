<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>명부(名簿) — 이름을 적는 일에 대하여</title>
<style>
  :root{
    --bg:#16181a; --panel:#23282c; --panel2:#2b3136;
    --line:#3a4248; --ink:#d7d2c4; --ink-dim:#8a8678; --sepia:#c9a25f;
    --danger:#d2503a; --ok:#6fae6f; --warn:#e0a23a; --cold:#5f8a93;
    --orange:#e08a2a; --paper:#e8e2d4; --ink2:#2a2620;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden;user-select:none;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);border-radius:3px;padding:9px 10px;
    font-size:13px;letter-spacing:.3px;transition:.12s;min-height:40px;}
  button:hover:not(:disabled){background:#353c42;border-color:#566;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-go{background:#3a2d20;border-color:#6a5230;color:var(--warn);font-weight:700;}
  .btn-go:hover:not(:disabled){background:#4a3927;}

  /* ================= HUD ================= */
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  #hud{display:flex;align-items:center;gap:14px;padding:7px 14px;
    background:linear-gradient(#202428,#191c1f);border-bottom:1px solid var(--line);
    font-size:14px;flex-wrap:wrap;}
  #hud .tag{display:flex;flex-direction:column;line-height:1.15;}
  #hud .tag b{font-size:18px;color:var(--sepia);font-variant-numeric:tabular-nums;}
  #hud .tag span{font-size:10px;color:var(--ink-dim);letter-spacing:1px;}
  #hud .tag.temp b{color:var(--cold);}
  #hud .tag.act b{color:var(--warn);}
  #hDate{font-size:12px;color:var(--ink-dim);letter-spacing:1px;
    border-left:1px solid var(--line);padding-left:14px;}
  #phasePill{padding:5px 12px;border-radius:2px;font-weight:700;
    border:1px solid var(--line);font-size:12px;letter-spacing:.5px;}
  .ph1{background:#26301f;color:#9ec97f;} .ph2{background:#1b2530;color:var(--cold);}
  .ph3{background:#2e2019;color:#d98f70;}
  #topctrl{display:flex;gap:6px;margin-left:auto;}
  #topctrl button{padding:6px 10px;min-height:auto;font-size:12px;}

  #coach{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:13px;
    background:linear-gradient(#212a1e,#1a1f19);border-bottom:1px solid var(--line);color:var(--warn);}
  #coach .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:0 0 9px;
    animation:pulseDot 1.4s infinite;}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(224,162,58,.6);}70%{box-shadow:0 0 0 9px rgba(224,162,58,0);}100%{box-shadow:0 0 0 0 rgba(224,162,58,0);}}
  #coach .msg{flex:1;} #coach .msg b{color:#fff;}

  /* ================= STAGE ================= */
  #stage{flex:1;position:relative;overflow:hidden;background:#15171a;}
  canvas{display:block;width:100%;height:100%;}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:35;overflow:hidden;}
  /* 클릭 물결 */
  .ripple{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    border:2px solid var(--sepia);animation:rip .6s ease-out forwards;}
  .ripple.act{border-color:var(--warn);width:26px;height:26px;margin:-13px 0 0 -13px;}
  @keyframes rip{from{transform:scale(.35);opacity:.95;}to{transform:scale(3.2);opacity:0;}}
  /* 떠오르는 수치 */
  .floater{position:absolute;transform:translate(-50%,0);font-size:15px;font-weight:800;
    color:var(--ok);text-shadow:0 1px 6px #000,0 0 3px #000;white-space:nowrap;
    animation:flo 1.15s ease-out forwards;}
  .floater.bad{color:var(--danger);} .floater.info{color:var(--sepia);}
  @keyframes flo{0%{transform:translate(-50%,6px);opacity:0;}18%{opacity:1;}
    100%{transform:translate(-50%,-52px);opacity:0;}}
  #log{position:absolute;left:10px;bottom:10px;width:min(330px,42%);max-height:30%;
    overflow-y:auto;background:rgba(16,18,20,.82);border:1px solid var(--line);
    border-radius:4px;padding:7px 10px;font-size:11.5px;line-height:1.5;z-index:20;}
  #log .e{color:var(--ink-dim);margin-bottom:3px;}
  #log .e b{color:var(--ink);}
  #log .e.good b{color:var(--ok);} #log .e.bad b{color:var(--danger);} #log .e.sys b{color:var(--sepia);}
  #toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:#0f1113;border:1px solid var(--sepia);color:var(--sepia);
    padding:9px 16px;border-radius:4px;font-size:13px;opacity:0;transition:.3s;
    pointer-events:none;z-index:40;max-width:90%;text-align:center;}
  #toast.good{border-color:var(--ok);color:var(--ok);}
  #toast.bad{border-color:var(--danger);color:var(--danger);}
  #tapHint{position:absolute;z-index:34;pointer-events:none;font-size:13px;color:#fff;
    background:rgba(224,138,42,.94);border-radius:20px;padding:7px 14px;font-weight:700;
    left:50%;top:34%;transform:translateX(-50%);box-shadow:0 4px 16px rgba(0,0,0,.5);
    animation:bob 1.15s ease-in-out infinite;display:none;}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-8px);}}

  /* ================= 인물 카드 바 ================= */
  #dock{display:flex;gap:9px;padding:8px 12px;background:#191c1f;
    border-top:1px solid var(--line);align-items:stretch;min-height:104px;}
  #crew{display:flex;gap:8px;flex:0 0 auto;}
  .pcard{width:150px;background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:7px 9px;cursor:pointer;transition:.14s;position:relative;overflow:hidden;}
  .pcard:hover{border-color:#5a6570;background:#272d32;}
  .pcard.sel{border-color:var(--warn);background:#2b2a20;
    box-shadow:0 0 0 1px rgba(224,162,58,.45),0 3px 14px rgba(0,0,0,.5);}
  .pcard.dead{opacity:.38;cursor:default;filter:grayscale(1);}
  .pcard .pn{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .pcard .pn i{font-style:normal;font-size:11px;color:var(--sepia);font-weight:400;}
  .pcard .pmood{font-size:10.5px;color:var(--ink-dim);margin:2px 0 4px;height:13px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .pbar{height:6px;background:#0e1012;border-radius:2px;margin-bottom:3px;overflow:hidden;
    display:flex;align-items:center;}
  .pbar i{display:block;height:100%;transition:width .3s;}
  .plbl{display:flex;gap:4px;font-size:9px;color:var(--ink-dim);margin-bottom:1px;}
  .plbl b{margin-left:auto;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums;}
  .pcard .pflag{position:absolute;top:6px;right:7px;font-size:14px;}
  #res{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:10px 12px;align-content:start;overflow-y:auto;}
  .ritem{display:flex;align-items:center;gap:9px;font-size:15px;font-variant-numeric:tabular-nums;}
  .ritem b{font-size:17px;}
  .ritem.low b{color:var(--danger);}
  #actions{flex:0 0 172px;display:flex;flex-direction:column;gap:6px;}

  /* ================= 모달 ================= */
  #overlay{position:fixed;inset:0;background:rgba(8,9,10,.86);display:none;
    align-items:center;justify-content:center;z-index:50;padding:14px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    max-width:740px;width:100%;max-height:94vh;overflow-y:auto;
    box-shadow:0 24px 70px rgba(0,0,0,.7);}
  .modal h2{margin:0;padding:13px 18px;font-size:16px;border-bottom:1px solid var(--line);
    background:#1f2327;letter-spacing:.5px;}
  .modal .body{padding:0;font-size:14px;line-height:1.65;}
  .modal .pad{padding:15px 18px;}
  .modal p{margin:0 0 12px;}
  /* 사건 삽화 */
  .evimg{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#0d0e10;}
  .evimg img{width:100%;height:100%;object-fit:cover;display:block;
    animation:kenburns 14s ease-out forwards;}
  @keyframes kenburns{from{transform:scale(1.06);}to{transform:scale(1.0);}}
  .evimg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(13,14,16,.25) 0%,rgba(13,14,16,0) 35%,rgba(35,40,44,.95) 100%);}
  .evimg .quote{position:absolute;left:20px;right:20px;bottom:12px;z-index:2;
    font-size:15px;line-height:1.6;color:#efe9d8;text-shadow:0 2px 10px #000;font-style:italic;}
  .evimg .quote small{display:block;font-style:normal;font-size:11px;
    color:var(--sepia);margin-top:5px;letter-spacing:.5px;}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .choices button{text-align:left;padding:12px 14px;}
  .choices button.unlocked{border-color:var(--sepia);background:#2c2a1f;}
  .choices button.unlocked::before{content:"🕯 ";}
  .rowbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
  .hint{font-size:11.5px;color:var(--ink-dim);margin-top:8px;line-height:1.55;}
  /* 기억(사료) 버튼 */
  .srcbtn{display:block;width:100%;text-align:left;background:#242a20;
    border:1px dashed var(--sepia);color:var(--sepia);font-size:13px;padding:10px 12px;margin:2px 0;}
  .srcbtn:hover{background:#2d341f;}
  .srcbox{background:#1b1e17;border:1px solid #4a4a32;border-left:3px solid var(--sepia);
    border-radius:4px;padding:11px 13px;margin:4px 0 2px;font-size:13px;line-height:1.65;color:#cfc9b4;}
  .srcbox .lbl{display:block;font-size:10.5px;letter-spacing:1.5px;color:var(--sepia);margin-bottom:5px;}
  .srcbox .cite{display:block;font-size:11px;color:var(--ink-dim);margin-top:7px;font-style:italic;}
  .unlocknote{color:var(--warn);font-size:12px;margin-top:8px;font-weight:700;}
  /* 제작 */
  .craftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:11px 12px;display:flex;flex-direction:column;gap:7px;}
  .card.locked{opacity:.45;}
  .card h5{margin:0;font-size:14px;}
  .card .desc{font-size:11.5px;color:var(--ink-dim);line-height:1.4;flex:1;}
  .cost{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;}
  .cost .c{padding:2px 7px;border-radius:3px;background:#1a1d20;border:1px solid #333;}
  .cost .c.miss{color:var(--danger);border-color:#5a2a22;}
  .card button{padding:7px;font-size:12px;min-height:34px;}
  /* 배낭 */
  .lootlist{display:flex;flex-direction:column;gap:6px;}
  .loot{display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:4px;padding:7px 9px;}
  .loot .nm{flex:1;font-size:13px;}
  .loot .ct{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px;text-align:center;}
  .loot button{padding:3px 11px;min-height:28px;font-size:14px;line-height:1;}
  .capbar{height:8px;background:#0e1012;border:1px solid #000;border-radius:2px;margin:8px 0 4px;overflow:hidden;}
  .capbar i{display:block;height:100%;background:var(--orange);transition:.2s;}

  /* ================= 날짜 배너 ================= */
  #dayBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(9,10,11,0.9);z-index:60;pointer-events:none;
    opacity:0;transition:opacity .45s;text-align:center;padding:20px;}
  #dayBanner.show{opacity:1;}
  #dayBanner .ddate{font-size:15px;color:var(--sepia);letter-spacing:5px;margin-bottom:12px;}
  #dayBanner .dnum{font-size:58px;font-weight:800;letter-spacing:2px;color:var(--ink);}
  #dayBanner .dph{margin-top:14px;font-size:14px;color:var(--warn);letter-spacing:3px;}
  #dayBanner .dnote{margin-top:20px;font-size:13px;color:var(--ink-dim);max-width:520px;line-height:1.75;
    border-top:1px solid #33383c;padding-top:16px;}
  @media(max-width:760px){#dayBanner .dnum{font-size:40px;}}

  /* ================= 대형 알림 카드 ================= */
  #notice{position:fixed;inset:0;z-index:80;pointer-events:none;display:flex;
    align-items:flex-start;justify-content:center;padding-top:12vh;overflow:hidden;}
  .ncard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:18px 34px;min-width:250px;max-width:86vw;
    background:linear-gradient(160deg,rgba(42,34,20,.97),rgba(24,26,20,.97));
    border:1px solid var(--sepia);border-radius:16px;
    box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 44px rgba(201,162,95,.28);
    animation:npop .5s cubic-bezier(.2,1.3,.4,1) both, nout .5s ease-in 1.7s forwards;}
  .ncard.good{border-color:var(--ok);box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 44px rgba(111,174,111,.32);}
  .ncard.bad{border-color:var(--danger);box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 44px rgba(210,80,58,.32);}
  .ncard .ni{font-size:52px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));
    animation:niPop .65s cubic-bezier(.2,1.6,.4,1) both;}
  .ncard .nt{margin-top:6px;font-size:23px;font-weight:900;letter-spacing:.5px;color:#ffd98a;}
  .ncard.good .nt{color:#b6e6b0;} .ncard.bad .nt{color:#ffb0a4;}
  .ncard .ns{margin-top:4px;font-size:14px;color:var(--ink);opacity:.93;}
  .ncard .ring{position:absolute;top:22px;left:50%;margin-left:-35px;width:70px;height:70px;
    border-radius:50%;border:3px solid var(--sepia);animation:nring .85s ease-out forwards;}
  .ncard.good .ring{border-color:var(--ok);} .ncard.bad .ring{border-color:var(--danger);}
  .conf{position:absolute;top:28px;left:50%;width:9px;height:9px;border-radius:2px;
    animation:nconf 1s ease-out forwards;}
  @keyframes npop{from{transform:translateY(-26px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes nout{to{transform:translateY(-14px) scale(.98);opacity:0;}}
  @keyframes niPop{0%{transform:scale(.2) rotate(-12deg);}60%{transform:scale(1.28) rotate(7deg);}100%{transform:scale(1) rotate(0);}}
  @keyframes nring{from{transform:scale(.3);opacity:.85;}to{transform:scale(2.6);opacity:0;}}
  @keyframes nconf{0%{transform:translate(0,0) rotate(0);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0;}}

  /* ================= 밤 시네마틱 ================= */
  #night{position:fixed;inset:0;z-index:70;display:none;background:#0a0b0c;
    align-items:center;justify-content:center;padding:0;}
  .nwrap{position:relative;width:100%;height:100%;overflow:hidden;}
  .nbg{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:brightness(.55) contrast(1.15) saturate(.7);animation:nslow 12s ease-out forwards;}
  @keyframes nslow{from{transform:scale(1.10);}to{transform:scale(1.0);}}
  .nveil{position:absolute;inset:0;background:
    radial-gradient(70% 60% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,.85) 100%);}
  .npanel{position:absolute;left:0;right:0;bottom:0;padding:22px 26px 26px;
    background:linear-gradient(180deg,rgba(10,11,12,0) 0%,rgba(10,11,12,.93) 38%);}
  .ninner{max-width:1096px;margin:0 auto;}
  .nloc,.ntxt{max-width:780px;}
  .nloc{font-size:11px;letter-spacing:4px;color:var(--sepia);margin-bottom:6px;}
  .ntxt{font-size:17px;line-height:1.75;color:#ece6d6;margin:0 0 14px;
    text-shadow:0 2px 10px #000;min-height:56px;}
  .nchoices{display:flex;gap:9px;flex-wrap:wrap;}
  .nchoices button{flex:1 1 200px;text-align:left;padding:13px 15px;font-size:13.5px;
    background:rgba(35,40,44,.9);}
  .nchoices .nback{flex:0 0 100%;background:transparent;border-color:#444;
    text-align:center;color:var(--ink-dim);font-size:12.5px;letter-spacing:1px;}

  /* ---- 목적지 카드 — 그림이 곧 선택지 ---- */
  .nchoices .loccard{flex:1 1 228px;max-width:33%;position:relative;height:178px;
    padding:0;overflow:hidden;border:1px solid var(--line);border-radius:5px;
    background:#0c0d0e;transition:border-color .2s, transform .2s, box-shadow .2s;}
  .nchoices .loccard:hover{border-color:var(--sepia);transform:translateY(-3px);
    box-shadow:0 10px 26px rgba(0,0,0,.6);}
  .lcart{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:brightness(.70) contrast(1.16) saturate(.5);
    transition:filter .35s ease, transform .6s ease;}
  .loccard:hover .lcart{filter:brightness(1.0) contrast(1.16) saturate(.72);transform:scale(1.07);}
  .lcsh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,
    rgba(8,9,10,.10) 0%, rgba(8,9,10,.34) 42%, rgba(8,9,10,.93) 100%);}
  .lcrisk{position:absolute;top:9px;right:9px;font-size:9.5px;letter-spacing:1.5px;
    background:rgba(8,9,10,.78);border:1px solid;border-radius:11px;padding:3px 9px;
    display:flex;align-items:center;gap:5px;}
  .lcrisk i{font-style:normal;font-size:7px;letter-spacing:1.5px;}
  .lctx{position:absolute;left:0;right:0;bottom:0;display:block;padding:0 14px 13px;}
  .lctx b{display:block;font-size:16.5px;letter-spacing:.5px;color:#f2ecdc;
    text-shadow:0 2px 10px #000;margin-bottom:4px;}
  .lctx em{display:block;font-style:normal;font-size:11.5px;line-height:1.5;color:#b5ad9d;}

  /* ---- 인물 카드 — 실제 그 사람이 나선다 ---- */
  .nchoices .scard{flex:1 1 210px;max-width:33%;display:flex;align-items:flex-end;gap:12px;
    padding:12px 14px 12px 10px;background:rgba(22,25,28,.88);
    border:1px solid var(--line);border-radius:5px;transition:border-color .2s, transform .2s;}
  .nchoices .scard:hover{border-color:var(--sepia);transform:translateY(-3px);
    background:rgba(30,34,38,.94);}
  .scpit{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;
    min-width:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));}
  .scpor{display:block;background-image:var(--sheet);background-repeat:no-repeat;}
  .sctx{flex:1 1 auto;display:block;min-width:0;}
  .sctx b{display:block;font-size:16px;color:#f2ecdc;letter-spacing:.5px;}
  .sctr{display:block;font-size:10.5px;letter-spacing:1px;color:var(--sepia);margin:1px 0 8px;}
  .scbar{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .scbar em{font-style:normal;font-size:10px;color:var(--ink-dim);flex:0 0 24px;}
  .scbar .pb{flex:1 1 auto;height:5px;background:#22262a;border-radius:3px;overflow:hidden;}
  .scbar .pb i{display:block;height:100%;transition:width .4s;}
  .scwarn{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.5px;color:var(--danger);}

  /* ---- 사건 선택 ---- */
  .nchoices .bcard{flex:1 1 260px;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:16px 18px;font-size:14.5px;line-height:1.5;color:#ece6d6;
    background:rgba(22,25,28,.9);border:1px solid var(--line);border-left:3px solid #3a4046;
    border-radius:4px;transition:border-color .2s, transform .2s, background .2s;}
  .nchoices .bcard:hover{background:rgba(32,36,40,.96);border-color:var(--sepia);
    border-left-color:var(--sepia);transform:translateX(3px);}
  .bcar{flex:0 0 auto;color:var(--sepia);opacity:.55;transition:opacity .2s;}
  .nchoices .bcard:hover .bcar{opacity:1;}
  @media(max-width:720px){
    .nchoices .loccard,.nchoices .pcard{max-width:100%;flex:1 1 100%;}
  }
  .nrisk{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:9px;background:rgba(10,11,12,.8);
    border:1px solid var(--line);border-radius:20px;padding:6px 16px;font-size:12px;color:var(--ink-dim);}
  .nrisk .rb{width:120px;height:7px;background:#22262a;border-radius:4px;overflow:hidden;}
  .nrisk .rb i{display:block;height:100%;background:linear-gradient(90deg,#6fae6f,#e0a23a,#d2503a);
    transition:width .5s;}
  /* 조준선 훑기 */

  .tgrad{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(75% 65% at 50% 38%, rgba(0,0,0,0) 0%, rgba(5,6,8,.86) 100%),
    linear-gradient(180deg, rgba(5,6,8,.72) 0%, rgba(5,6,8,0) 26%, rgba(5,6,8,.5) 62%, rgba(5,6,8,.97) 100%);}
